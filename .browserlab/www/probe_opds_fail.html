<!DOCTYPE html><html><head><meta charset="utf-8"/>
<title>OPDS-FAIL-PROBE</title>
</head><body>
<div id="out" style="font-size:12px;white-space:pre-wrap;max-height:200px;overflow:auto">OPDS-FAIL-PROBE-PENDING</div>
<iframe id="app" style="width:412px;height:800px;border:1px solid #ccc"></iframe>
<script>
// D8 块C failure-path probe: an unreachable OPDS URL must land in the app's
// error view (Cannot Load Page / 无法加载页面), not a crash or an eternal
// spinner. The lab proxy answers status 0 for unreachable targets, which
// mirrors the device-side ArkTS http BusinessError path.
(function () {
  var out = document.getElementById('out');
  var marks = ['OPDS-FAIL-PROBE'];
  function mark(s) {
    marks.push(s);
    out.textContent = marks.join('\n');
  }
  function frame() { return document.getElementById('app'); }
  function doc() { return frame().contentDocument; }
  function win() { return frame().contentWindow; }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  async function waitFor(fn, timeout, label) {
    var t0 = Date.now();
    while (Date.now() - t0 < timeout) {
      try { var v = fn(); if (v) return v; } catch (e) { /* keep polling */ }
      await sleep(250);
    }
    throw new Error('timeout: ' + label);
  }
  function visText(el) { return (el.textContent || '').replace(/\s+/g, ' ').trim(); }
  async function run() {
    // port 9 (discard) is unreachable in ~all environments
    var BAD = 'http://127.0.0.1:9/dead.opds';
    frame().src = '/opds?url=' + encodeURIComponent(BAD);
    await waitFor(function () {
      var d = doc();
      return d && d.readyState === 'complete';
    }, 25000, 'iframe boot');
    mark('LOADED');
    var errView = await waitFor(function () {
      var d = doc();
      if (!d || !d.querySelectorAll) return null;
      // error view headline (en/zh) OR an error toast OR the reload button
      var els = d.querySelectorAll('h1, button, div');
      for (var i = 0; i < els.length; i++) {
        var t = visText(els[i]);
        if (/Cannot Load Page|无法加载页面|无法載入頁面/.test(t)) return els[i];
      }
      var rb = d.querySelectorAll('button');
      for (var j = 0; j < rb.length; j++) {
        if (/^(Reload Page|重新加载|重新載入)/.test(visText(rb[j]))) return rb[j];
      }
      return null;
    }, 60000, 'error view');
    mark('ERROR-VIEW: ' + visText(errView).slice(0, 60));
    // the page must still be alive: no uncaught fatal errors beyond the
    // expected network failure chain
    var fatal = [];
    try {
      (win().__errors || []).forEach(function (e) {
        if (String(e).indexOf('construct') >= 0 || String(e).indexOf('TypeError') >= 0 ||
            String(e).indexOf('SyntaxError') >= 0) {
          fatal.push(String(e).slice(0, 90));
        }
      });
    } catch (e) { /* keep going */ }
    mark('FATALS: ' + (fatal.join(' | ') || 'none'));
    var ok = true;
    mark(ok ? 'OPDS-FAIL-PROBE-PASS' : 'OPDS-FAIL-PROBE-FAIL');
  }
  run().catch(function (e) {
    mark('OPDS-FAIL-PROBE-FAIL :: ' + (e && e.message ? e.message : String(e)));
  });
}());
</script></body></html>
