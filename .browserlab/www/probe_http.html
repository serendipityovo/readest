<!DOCTYPE html><html><head><meta charset="utf-8"/>
<title>HTTP-PROBE</title>
<script src="/tauri_shim.js?v=evt1"></script>
<script src="/mock_bridge.js?v=pick1"></script>
</head><body>
<div id="out" style="font-size:12px;white-space:pre-wrap">HTTP-PROBE-PENDING</div>
<script>
// D10 回归 v3 断言源：plugin:http fetch 链真网 200（gutenberg OPDS）。
// 直接走 shim invoke（本页自带 shim+mock），断言哨兵两段式读body语义。
(function () {
  var out = document.getElementById('out');
  var marks = ['HTTP-PROBE'];
  function mark(s) { marks.push(s); out.textContent = marks.join('\n'); }
  function invoke(cmd, args) {
    return window.__TAURI_INTERNALS__.invoke(cmd, args);
  }
  async function run() {
    var url = 'https://www.gutenberg.org/ebooks.opds/';
    var rid = await invoke('plugin:http|fetch', {
      clientConfig: {
        method: 'GET',
        url: url,
        headers: [['User-Agent', 'Readest/1.0 (OPDS Browser)'], ['Accept', 'application/atom+xml']]
      }
    });
    var info = await invoke('plugin:http|fetch_send', { rid: rid });
    mark('STATUS: ' + info.status);
    var chunks = [];
    var total = 0;
    for (var i = 0; i < 8; i++) {
      var data = await invoke('plugin:http|fetch_read_body', { rid: info.rid });
      var last = data[data.length - 1];
      var body = data.slice(0, data.length - 1);
      total += body.length;
      if (last === 1) break;
    }
    mark('BODY-BYTES: ' + total);
    var hdrCount = (info.headers || []).length;
    mark('RESP-HEADERS: ' + hdrCount);
    var ok = info.status === 200 && total > 5000 && hdrCount >= 5;
    mark(ok ? 'HTTP-PROBE-PASS' : 'HTTP-PROBE-FAIL');
  }
  run().catch(function (e) {
    mark('HTTP-PROBE-FAIL :: ' + (e && e.message ? e.message : String(e)));
  });
}());
</script></body></html>
